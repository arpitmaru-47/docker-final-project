services:
  
  web:
    build:
      context: ./app

    ports:
      - "5000:5000"

    environment:
      MONGO_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/dev_db?authSource=admin

    depends_on:
      mongo:
        condition: service_healthy

    networks:
      - app-network
 
    read_only: true  

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    mem_limit: 256m
    cpus: 0.5

  mongo:
    image: mongo:7

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}

    volumes:
      - mongo-data:/data/db

    networks:
      - app-network

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
